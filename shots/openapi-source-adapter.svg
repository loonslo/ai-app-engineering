<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="100%">
  <defs>
    <style>
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 8px; }
      .inner-box { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 6px; }
      .inner-box-red { fill: #fdf2f2; stroke: #fecaca; stroke-width: 1; rx: 6px; }
      .inner-box-green { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1; rx: 6px; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", sans-serif; font-size: 15px; font-weight: 600; fill: #0f172a; }
      .sub-title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", sans-serif; font-size: 13px; font-weight: 600; fill: #334155; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", sans-serif; font-size: 12px; fill: #64748b; }
      .code-text { font-family: "SF Mono", Menlo, Monaco, Consolas, "Cascadia Code", monospace; font-size: 11px; fill: #475569; }
      .alert-text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", sans-serif; font-size: 12px; font-weight: 600; fill: #b5442c; }
      .success-text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", sans-serif; font-size: 12px; font-weight: 600; fill: #166534; }
      .arrow { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
      .arrow-head { fill: #94a3b8; }
      @media (prefers-color-scheme: dark) {
        .card-bg { fill: #18191c; stroke: #2e3440; }
        .inner-box { fill: #1e222b; stroke: #2a303c; }
        .inner-box-red { fill: #2b1d1d; stroke: #5c2828; }
        .inner-box-green { fill: #19271f; stroke: #22543d; }
        .title-text { fill: #f8fafc; }
        .sub-title { fill: #e2e8f0; }
        .desc-text { fill: #94a3b8; }
        .code-text { fill: #cbd5e1; }
        .alert-text { fill: #f87171; }
        .success-text { fill: #4ade80; }
        .arrow { stroke: #64748b; }
        .arrow-head { fill: #64748b; }
      }
    </style>
  </defs>

  <!-- 左侧：数据源输入 -->
  <g transform="translate(25, 25)">
    <rect width="250" height="310" class="card-bg" />
    <text x="20" y="36" class="title-text">数据源提供方式 (Source)</text>
    <text x="20" y="56" class="desc-text">两种可选的接口契约来源</text>

    <!-- OpenAPI 模式 -->
    <rect x="15" y="75" width="220" height="105" class="inner-box-green" />
    <text x="25" y="98" class="success-text">接口文档模式 (OpenAPI / Swagger)</text>
    <text x="25" y="120" class="desc-text">• 本地文件: recruit-openapi.json</text>
    <text x="25" y="140" class="desc-text">• 在线 URL: /v2/api-docs</text>
    <text x="25" y="160" class="code-text">ROI 高，结构清晰，零代码运行</text>

    <!-- 源码模式 -->
    <rect x="15" y="195" width="220" height="95" class="inner-box" />
    <text x="25" y="218" class="sub-title">代码仓库模式 (Git Repo)</text>
    <text x="25" y="240" class="desc-text">• 指定本地只读 Git 仓库</text>
    <text x="25" y="260" class="desc-text">• AST 静态语法树解析控制器</text>
    <text x="25" y="280" class="code-text">适合无现成 Swagger 的服务</text>
  </g>

  <!-- 连接箭头 1 -->
  <g transform="translate(285, 175)">
    <line x1="0" y1="0" x2="35" y2="0" class="arrow" />
    <polygon points="35,-4 42,0 35,4" class="arrow-head" />
    <text x="18" y="-10" text-anchor="middle" class="code-text">适配器层</text>
  </g>

  <!-- 中间：适配器与解析处理 -->
  <g transform="translate(340, 25)">
    <rect width="260" height="310" class="card-bg" />
    <text x="20" y="36" class="title-text">OpenAPIAdapter 解析与守卫</text>
    <text x="20" y="56" class="desc-text">统一转译为中间结构 IR 清单</text>

    <rect x="15" y="75" width="230" height="85" class="inner-box" />
    <text x="25" y="98" class="sub-title">结构解析与标准化</text>
    <text x="25" y="120" class="desc-text">• 提取 paths、方法、参数 Schema</text>
    <text x="25" y="140" class="desc-text">• 挂载 Base Path: /api/recruit</text>

    <rect x="15" y="175" width="230" height="125" class="inner-box-red" />
    <text x="25" y="198" class="alert-text">边界防护与安全守卫</text>
    <text x="25" y="220" class="desc-text">• 引用校验: 阻断循环与外部恶意 $ref</text>
    <text x="25" y="240" class="desc-text">• 凭据安全: 认证头只从环境变量读取</text>
    <text x="25" y="260" class="desc-text">• 预算控制: 限制单文件与累计字节数</text>
    <text x="25" y="282" class="alert-text">标记文档为 unverified-document</text>
  </g>

  <!-- 连接箭头 2 -->
  <g transform="translate(610, 175)">
    <line x1="0" y1="0" x2="35" y2="0" class="arrow" />
    <polygon points="35,-4 42,0 35,4" class="arrow-head" />
    <text x="18" y="-10" text-anchor="middle" class="code-text">生成资产</text>
  </g>

  <!-- 右侧：任务配置与过程资产 -->
  <g transform="translate(660, 25)">
    <rect width="235" height="310" class="card-bg" />
    <text x="20" y="36" class="title-text">过程文件追溯 (Task Assets)</text>
    <text x="20" y="56" class="desc-text">冻结目标，进入 discovered 状态</text>

    <rect x="15" y="75" width="205" height="150" class="inner-box" />
    <text x="25" y="98" class="code-text font-bold">task.json 任务配置契约</text>
    <text x="25" y="120" class="code-text">"task_id": "task-apple-01"</text>
    <text x="25" y="140" class="code-text">"adapter": "openapi"</text>
    <text x="25" y="160" class="code-text">"document_paths": [...]</text>
    <text x="25" y="180" class="code-text">"scope": ["*"]</text>
    <text x="25" y="200" class="code-text">"status": "discovered"</text>

    <rect x="15" y="240" width="205" height="60" class="inner-box-green" />
    <text x="25" y="262" class="success-text">产物: inventory.json</text>
    <text x="25" y="282" class="desc-text">标准接口清单已落盘，待下一步</text>
  </g>
</svg>
