<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>企业知识库助手 · 演示</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    label { display: block; margin: .75rem 0 .25rem; font-weight: 600; }
    input, textarea { width: 100%; box-sizing: border-box; padding: .5rem; font: inherit; }
    .row { display: flex; gap: .5rem; } .row > * { flex: 1; }
    button { padding: .5rem 1rem; font: inherit; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .6; }
    #answer { white-space: pre-wrap; margin: .5rem 0; }
    .badge { display: inline-block; padding: .1rem .5rem; border-radius: .25rem; font-size: .85rem; margin-right: .5rem; }
    .degraded { background: #fff3cd; color: #664d03; } .human { background: #f8d7da; color: #58151c; } .cache { background: #e2e3e5; color: #41464b; }
    .error { background: #f8d7da; color: #58151c; padding: .5rem .75rem; border-radius: .25rem; }
    .muted { color: #666; font-size: .9rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>企业知识库助手</h1>
  <p class="muted">公开演示页面（零依赖静态页）。开发调试界面见仓库里的 <code>app_streamlit.py</code>。</p>

  <details open>
    <summary>登录</summary>
    <label for="token">访问令牌（Bearer token，不会被保存，也不要写进源码）</label>
    <input id="token" type="password" autocomplete="off">
    <p class="muted">本地开发时可以用开发登录换一个令牌（生产环境该接口不可用）：</p>
    <div class="row">
      <input id="dev-user" placeholder="用户名，例如 alice" aria-label="用户名">
      <input id="dev-tenant" placeholder="租户，例如 default" aria-label="租户">
      <button id="dev-login" type="button">开发登录</button>
    </div>
  </details>

  <label for="question">问题</label>
  <textarea id="question" rows="3" maxlength="4000"></textarea>
  <p><button id="ask" type="button">提问</button> <span id="status" class="muted"></span></p>

  <div id="error" class="error" role="alert" hidden></div>

  <section id="result" hidden>
    <div id="badges"></div>
    <div id="answer"></div>
    <h2>引用</h2>
    <ul id="sources"></ul>
    <p>
      这个回答：
      <button id="up" type="button">有用</button>
      <button id="down" type="button">没用</button>
      <span id="feedback-note" class="muted" hidden></span>
    </p>
    <p class="muted">request_id：<span id="request-id"></span>（报障时提供）</p>
  </section>

  <script src="app.js"></script>
</body>
</html>
